name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: "${CONTAINER_LOG_MAX_FILES:-3}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine3.24}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Set ZABBIX_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix} -d ${ZABBIX_DB_NAME:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE:-zabbix/zabbix-server-pgsql:7.4.14-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Set ZABBIX_DB_PASSWORD in .env}
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-10}
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS:-5}
      ZBX_STARTDISCOVERERS: ${ZBX_STARTDISCOVERERS:-2}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-32M}
      ZBX_HISTORYCACHESIZE: ${ZBX_HISTORYCACHESIZE:-16M}
      ZBX_TRENDCACHESIZE: ${ZBX_TRENDCACHESIZE:-16M}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ZABBIX_BIND_ADDRESS:-127.0.0.1}:${ZABBIX_SERVER_PORT:-10051}:10051"
    networks: [database, visualization, telemetry]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE:-zabbix/zabbix-web-nginx-pgsql:7.4.14-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?Set ZABBIX_DB_PASSWORD in .env}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ZABBIX_WEB_PORT:-8080}:8080"
    networks: [database, visualization]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana-init:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.4}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-grafana-init
    restart: "no"
    user: "472:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -f /var/lib/grafana/plugins/alexanderzobnin-zabbix-app/plugin.json &&
        grep -q '"version": "${GRAFANA_ZABBIX_PLUGIN_VERSION:-6.6.0}"'
        /var/lib/grafana/plugins/alexanderzobnin-zabbix-app/plugin.json && exit 0;
        rm -rf /var/lib/grafana/plugins/alexanderzobnin-zabbix-app;
        exec grafana cli --pluginsDir /var/lib/grafana/plugins plugins install
        alexanderzobnin-zabbix-app ${GRAFANA_ZABBIX_PLUGIN_VERSION:-6.6.0}
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [visualization]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.4}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: ${GF_FEATURE_TOGGLES_ENABLE:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      grafana-init:
        condition: service_completed_successfully
      zabbix-web:
        condition: service_healthy
      loki:
        condition: service_started
      jaeger:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks: [visualization]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.6}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    expose: ["3100"]
    networks: [visualization, telemetry]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  otel-collector:
    image: ${OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.157.0}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki:
        condition: service_started
      jaeger:
        condition: service_healthy
    ports:
      - "${TELEMETRY_BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${TELEMETRY_BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    expose: ["13133"]
    networks: [telemetry]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  jaeger-init:
    image: ${ALPINE_IMAGE:-alpine:3.22.1}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-jaeger-init
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /badger"]
    volumes:
      - jaeger-data:/badger
    network_mode: none
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.76.0}
    container_name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    expose: ["14269"]
    networks: [visualization, telemetry]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/go/bin/all-in-one-linux", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  database:
    driver: bridge
    internal: true
  visualization:
    driver: bridge
  telemetry:
    driver: bridge

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-postgres
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-grafana
  loki-data:
    name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-loki
  jaeger-data:
    name: ${COMPOSE_PROJECT_NAME:-zabbix-obs}-jaeger
