---
- name: Check supported guest OS
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13') or
        (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '24.04')
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: Use an x86_64 Debian 13 or Ubuntu 24.04 cloud-init guest.

- name: Install OS prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, python3, sudo, qemu-guest-agent]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apply OS updates when explicitly requested
  ansible.builtin.apt:
    upgrade: safe
  when: obs_upgrade_os | default(false) | bool

- name: Create apt key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Configure official Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
  register: docker_repository

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: "{{ 'latest' if obs_upgrade_docker | default(false) | bool else 'present' }}"
    update_cache: "{{ docker_repository.changed }}"

- name: Enable guest services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [docker, qemu-guest-agent]
